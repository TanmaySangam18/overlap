services:
  - type: web
    name: overlap
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Secrets are dashboard-set only (sync: false) — never values in
      # this public repo. WHATSAPP_VERIFY_TOKEN was rotated 2026-11-18
      # after the original value shipped in this file.
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: OVERLAP_API_TOKEN
        sync: false
      - key: OVERLAP_HASH_PEPPER
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SENDBLUE_API_KEY_ID
        sync: false
      - key: SENDBLUE_API_SECRET_KEY
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: SENDBLUE_WEBHOOK_SECRET
        sync: false
      - key: BLUEBUBBLES_SERVER_URL
        sync: false
      - key: BLUEBUBBLES_PASSWORD
        sync: false
      - key: BLUEBUBBLES_WEBHOOK_SECRET
        sync: false
