services:
  - type: web
    name: overlap
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WHATSAPP_VERIFY_TOKEN
        value: overlap-verify-777
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SENDBLUE_API_KEY_ID
        sync: false
      - key: SENDBLUE_API_SECRET_KEY
        sync: false
      - key: SENDBLUE_FROM_NUMBER
        sync: false
      - key: SENDBLUE_WEBHOOK_SECRET
        sync: false
      - key: BLUEBUBBLES_SERVER_URL
        sync: false
      - key: BLUEBUBBLES_PASSWORD
        sync: false
      - key: BLUEBUBBLES_WEBHOOK_SECRET
        sync: false
